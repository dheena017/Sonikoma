name: CI

on:
  push:
    branches: ["main-development"]
  pull_request:
    branches: ["main-development"]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build:frontend

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          pip install -r backend/requirements.txt

      - name: Check backend syntax
        run: python -m py_compile backend/app/main.py

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=app python -m pytest -q
