<!-- Sticky Top Header Bar -->
<header class="sonikoma-top-bar">
  <div class="top-bar-left">
    <button class="header-sidebar-toggle-btn" onclick="window.sonikomaToggleSidebar();" title="Toggle Navigation Sidebar">
      <span class="toggle-icon">☰</span>
    </button>
    <div class="breadcrumb">
      <span class="breadcrumb-root">⚡ Sonikoma</span>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current">__CATEGORY_LABEL__</span>
    </div>
  </div>

  <div class="top-bar-center">
    <div class="top-search-wrapper">
      <input type="text" class="top-header-search-input" placeholder="🔍 Search endpoints & schemas... (Ctrl+K or /)" oninput="window.sonikomaFilterEndpoints(this.value);" />
    </div>
  </div>

  <div class="top-bar-right">
    <button class="top-bar-btn authorize-btn" onclick="window.sonikomaOpenAuthModal();" title="Authenticate API session via OAuth2 Password Bearer">
      <span class="auth-icon">🔓</span>
      <span>Authorize</span>
    </button>
    <a href="/api/docs" class="top-bar-link" title="Interactive Swagger UI Console">
      <span>⚡ Swagger UI</span>
    </a>
    <a href="/api/docs/schemas" class="top-bar-link" title="Data Models & Schema Explorer">
      <span>💎 Schemas</span>
    </a>
    <a href="/api/redoc" class="top-bar-link" title="ReDoc Documentation">
      <span>📖 ReDoc</span>
    </a>
    <a href="http://localhost:3000" target="_blank" class="top-bar-link" title="Open Web App">
      <span>🚀 Web App</span>
    </a>
    <a href="/api/openapi.json" target="_blank" class="top-bar-link outline" title="OpenAPI JSON">
      <span>{ } JSON</span>
    </a>
  </div>
</header>

<!-- Floating Quick Action Dock -->
<div class="sonikoma-floating-dock">
  <button class="dock-btn" onclick="window.sonikomaToggleAll();" title="Expand or collapse all endpoint panels">
    <span>⤢ Toggle All</span>
  </button>
  <button class="dock-btn" onclick="var el = document.querySelector('.operation-filter-input'); if (el) { el.focus(); el.scrollIntoView({behavior: 'smooth', block: 'center'}); }" title="Jump to search bar (or press / or Ctrl+K)">
    <span>🔍 Search <kbd style='background:rgba(255,255,255,0.15); padding:1px 4px; border-radius:3px; font-size:10px;'>/</kbd></span>
  </button>
  <button class="dock-btn primary" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });" title="Scroll to top of documentation">
    <span>↑ Top</span>
  </button>
</div>
