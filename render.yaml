# Render Web Service deployment configuration for Sonikoma
services:
  - type: web
    name: sonikoma-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/app && uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
