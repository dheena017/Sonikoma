<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1720" />
      <stop offset="100%" stop-color="#050a0e" />
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Isometric Stacking Comic / Episodic Panels -->
  <g filter="url(#glow)" stroke="url(#cyanGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base Panel 3 -->
    <polygon points="256,230 376,170 256,110 136,170" fill="#0d2438" fill-opacity="0.5" stroke-opacity="0.5" />
    
    <!-- Middle Panel 2 -->
    <polygon points="256,290 376,230 256,170 136,230" fill="#0f304d" fill-opacity="0.7" stroke-opacity="0.8" />
    
    <!-- Top Active Panel 1 -->
    <polygon points="256,350 376,290 256,230 136,290" fill="#133d63" fill-opacity="0.9" stroke="url(#cyanGlow)" stroke-width="7" />
    
    <!-- Glowing Core Nodes -->
    <line x1="256" y1="170" x2="256" y2="290" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="6 4" />
    <circle cx="256" cy="230" r="8" fill="#7dd3fc" stroke="none" />
    <circle cx="256" cy="290" r="10" fill="#38bdf8" stroke="none" />
    <circle cx="256" cy="350" r="7" fill="#0ea5e9" stroke="none" />

    <!-- Sparkle Stars -->
    <polygon points="380,130 384,142 396,146 384,150 380,162 376,150 364,146 376,142" fill="#38bdf8" stroke="none" />
    <polygon points="130,340 133,349 142,352 133,355 130,364 127,355 118,352 127,349" fill="#38bdf8" stroke="none" />
  </g>
</svg>
