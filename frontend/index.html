<!DOCTYPE html>
<html lang="en" style="background-color: #09090b; color: #fafafa;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Metadata -->
    <title>Sonikoma - AI Storyboard & Video Production</title>
    <meta name="title" content="Sonikoma - AI Storyboard & Video Production" />
    <meta
      name="description"
      content="Transform static webtoons into cinematic videos. Crop panels, clean speech bubbles, synthesize voice narration, generate music soundtracks, and produce high-quality videos using advanced AI."
    />
    <meta
      name="keywords"
      content="webtoon to video, webtoon animation, ai storyboard, panel extraction, bubble cleaner, speech bubble erase, voice synthesis, webtoon compiler, ai video editor"
    />
    <meta name="author" content="Antigravity Studio" />
    <meta name="robots" content="index, follow" />
    <meta
      name="google-site-verification"
      content="YtkrPf-auk5l9rPbcYJMQ-Ax43a5oHQv6MN3N3E1734"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sonikoma.vercel.app" />
    <meta
      property="og:title"
      content="Sonikoma - AI Storyboard & Video Production"
    />
    <meta
      property="og:description"
      content="Transform static webtoons into cinematic videos. Crop panels, clean speech bubbles, synthesize voice narration, generate music soundtracks, and produce high-quality videos using advanced AI."
    />
    <meta property="og:image" content="https://sonikoma.vercel.app/logo-dark.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Sonikoma" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sonikoma.vercel.app" />
    <meta
      property="twitter:title"
      content="Sonikoma - AI Storyboard & Video Production"
    />
    <meta
      property="twitter:description"
      content="Transform static webtoons into cinematic videos. Crop panels, clean speech bubbles, synthesize voice narration, generate music soundtracks, and produce high-quality videos using advanced AI."
    />
    <meta
      property="twitter:image"
      content="https://sonikoma.vercel.app/logo-dark.png"
    />

    <!-- Mobile App Settings & Customization -->
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sonikoma" />

    <!-- Icons & Favicons -->
    <link id="app-favicon" rel="icon" href="/logo-dark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-dark.png" />
    
    <!-- Performance Optimization: Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Instant Load Base Styles to prevent White Flash -->
    <style>
      html, body {
        background-color: #09090b !important;
        color: #fafafa;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: #09090b;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #09090b;
        color: #a1a1aa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .initial-loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: sonikoma-spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes sonikoma-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Google Search Structured Data (JSON-LD) for Rich Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sonikoma",
        "alternateName": "Sonikoma Video Compiler",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "Transform static 4koma manga and webtoons into cinematic videos with AI voice narration, panel cropping, and automated editing.",
        "url": "https://sonikoma.vercel.app",
        "image": "https://sonikoma.vercel.app/logo.png",
        "author": {
          "@type": "Organization",
          "name": "Antigravity Studio"
        },
        "offers": {
          "@type": "Offer",
          "price": "19",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sonikoma",
        "url": "https://sonikoma.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sonikoma.vercel.app/dashboard?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body style="background-color: #09090b; color: #fafafa; margin: 0;">
    <!-- Fallback message for disabled Javascript -->
    <noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #070709;
          color: #fafafa;
          font-family: sans-serif;
          text-align: center;
          padding: 2rem;
        "
      >
        <h1 style="color: #ef4444; font-size: 2rem; margin-bottom: 1rem">
          JavaScript Required
        </h1>
        <p style="color: #a3a3a3; max-width: 500px">
          We're sorry, but Sonikoma requires JavaScript to be enabled. Please
          enable JavaScript in your browser settings to continue.
        </p>
      </div>
    </noscript>

    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: #a1a1aa;">
          SONIKOMA
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
