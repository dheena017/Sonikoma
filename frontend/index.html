  <head>

    <!-- Mobile App Settings & Customization -->
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sonikoma" />

    <!-- Icons & Favicons -->
    <link id="app-favicon" rel="icon" href="/logo-dark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-dark.png" />
    
    <!-- Performance Optimization: Resource Hints & Non-blocking Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <!-- Instant Load Base Styles to match LoadingPage design -->
    <style>
      html, body {
        background-color: #050507 !important;
        color: #fafafa;
        margin: 0;
        padding: 0;
        height: 100vh;
        max-height: 100vh;
        width: 100%;
        overflow: hidden;
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        background-color: #050507;
      }
      .lp-root {
        position: fixed;
        inset: 0;
        background: #050507;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
        overflow: hidden;
      }
      .lp-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
        border-radius: 24px;
        background: rgba(10, 10, 15, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 400px;
        position: relative;
        z-index: 1;
      }
      .lp-logo-wrapper {
        position: relative;
        margin-bottom: 16px;
        animation: lp-pulse 2s infinite ease-in-out;
      }
      .lp-logo-glow {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 18px;
        background: linear-gradient(135deg, #a855f7, #06b6d4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lp-logo-img {
        width: 100%;
        height: 100%;
        border-radius: 15px;
        object-fit: cover;
        padding: 3px;
        background: #000000;
        box-sizing: border-box;
      }
      .lp-app-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
        background: linear-gradient(to right, #ffffff, #e4e4e7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .lp-status-text {
        font-size: 0.75rem;
        color: #9ca3af;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 24px;
        text-align: center;
      }
      .lp-progress-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }
      .lp-progress-bar-bg {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .lp-progress-bar-fill {
        width: 40%;
        height: 100%;
        background: linear-gradient(to right, #a855f7, #06b6d4);
        border-radius: 9999px;
        animation: lp-shimmer 1.4s infinite ease-in-out;
        position: absolute;
      }
      .lp-spinner {
        width: 20px;
        height: 20px;
        color: #a855f7;
        animation: lp-spin 1s linear infinite;
      }

      @keyframes lp-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes lp-shimmer {
        0%   { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes lp-pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.02); }
      }
    </style>

    <!-- Google Search Structured Data (JSON-LD) for Rich Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sonikoma",
        "alternateName": "Sonikoma Video Compiler",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "Transform static 4koma manga and webtoons into cinematic videos with AI voice narration, panel cropping, and automated editing.",
        "url": "https://sonikoma.vercel.app",
        "image": "https://sonikoma.vercel.app/logo.png",
        "author": {
          "@type": "Organization",
          "name": "Antigravity Studio"
        },
        "offers": {
          "@type": "Offer",
          "price": "19",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sonikoma",
        "url": "https://sonikoma.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sonikoma.vercel.app/dashboard?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body style="background-color: #050507; color: #fafafa; margin: 0;">
    <!-- Fallback message for disabled Javascript -->
    <noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #070709;
          color: #fafafa;
          font-family: sans-serif;
          text-align: center;
          padding: 2rem;
        "
      >
        <h1 style="color: #ef4444; font-size: 2rem; margin-bottom: 1rem">
          JavaScript Required
        </h1>
        <p style="color: #a3a3a3; max-width: 500px">
          We're sorry, but Sonikoma requires JavaScript to be enabled. Please
          enable JavaScript in your browser settings to continue.
        </p>
      </div>
    </noscript>

    <div id="root">
      <div class="lp-root">
        <div class="lp-card">
          <!-- Pulsing Glowing Logo Wrapper -->
          <div class="lp-logo-wrapper">
            <div class="lp-logo-glow">
              <img
                src="/logo-dark.png"
                alt="Sonikoma Logo"
                class="lp-logo-img"
              />
            </div>
          </div>

          <!-- App name -->
          <div class="lp-app-title">
            Sonikoma
          </div>

          <!-- Tagline / status -->
          <div class="lp-status-text">
            Initializing
          </div>

          <!-- Progress Display -->
          <div class="lp-progress-wrapper">
            <div class="lp-progress-bar-bg">
              <div class="lp-progress-bar-fill"></div>
            </div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              class="lp-spinner"
            >
              <circle
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                strokeWidth="3"
                opacity="0.15"
              />
              <path
                fill="currentColor"
                opacity="0.85"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
